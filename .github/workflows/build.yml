name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build challenge and solution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: "2"
      LAKE_CONFIG: ${{ github.workspace }}/.github/lake-cache.toml
      LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch Mathlib build artifacts
        env:
          MATHLIB_CACHE_DIR: ${{ runner.temp }}/mathlib-cache
        run: |
          lake exe cache get
          rm -rf -- "$MATHLIB_CACHE_DIR"
      - name: Fetch Tau Ceti cache mappings
        run: |
          if ! lake cache get --package=TauCeti --repo=TauCetiProject/TauCeti \
              --service=tauceti --max-revs=1 --mappings-only; then
            echo "::warning::Tau Ceti cache unavailable. Lake will build missing modules from source."
          fi
      - name: Cache built QPainleve modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/packages/QPainleve/.lake/build
          key: qpainleve-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Build the challenge and solution
        env:
          LAKE_RESTORE_ARTIFACTS: "true"
        run: lake build Challenge Solution
